name: Windows and SQL integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-integration:
    # Require runner v2.329.0+, SQL Server 2022+, the three disposable SQL
    # test logins, and the `workerdock-sql` label before enabling this workflow.
    runs-on: [self-hosted, windows, x64, workerdock-sql]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Require the disposable SQL fixture connection
        shell: pwsh
        env:
          WORKERDOCK_TEST_SQL: ${{ secrets.WORKERDOCK_TEST_SQL }}
          WORKERDOCK_TEST_SQL_RUNTIME: ${{ secrets.WORKERDOCK_TEST_SQL_RUNTIME }}
          WORKERDOCK_TEST_SQL_TARGET_RUNTIME: ${{ secrets.WORKERDOCK_TEST_SQL_TARGET_RUNTIME }}
        run: |
          $required = @('WORKERDOCK_TEST_SQL', 'WORKERDOCK_TEST_SQL_RUNTIME', 'WORKERDOCK_TEST_SQL_TARGET_RUNTIME')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name must be configured as a GitHub Actions secret for the disposable SQL test instance."
            }
          }
      - name: Restore locked dependencies
        run: dotnet restore WorkerDock.slnx --locked-mode
      - name: Run SQL-backed integration tests
        shell: pwsh
        env:
          WORKERDOCK_TEST_SQL: ${{ secrets.WORKERDOCK_TEST_SQL }}
          WORKERDOCK_TEST_SQL_RUNTIME: ${{ secrets.WORKERDOCK_TEST_SQL_RUNTIME }}
          WORKERDOCK_TEST_SQL_TARGET_RUNTIME: ${{ secrets.WORKERDOCK_TEST_SQL_TARGET_RUNTIME }}
        run: dotnet test WorkerDock.slnx --no-restore -c Release --filter "Store=Sql"
