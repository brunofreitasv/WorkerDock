<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" aria-labelledby="title desc">
  <title id="title">Alert rule to webhook delivery</title><desc id="desc">Review an enabled sink and disabled rule, enable the rule, then matching events open an incident and the outbox worker attempts delivery.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#52627a"/></marker></defs><rect width="400" height="700" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17243a"><rect x="30" y="20" width="340" height="82" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="200" y="56" font-size="21" font-weight="700">Enabled sink</text><text x="200" y="84" font-size="18">Approved destination</text><rect x="30" y="130" width="340" height="82" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="200" y="166" font-size="21" font-weight="700">Disabled rule</text><text x="200" y="194" font-size="18">Review its condition first.</text><rect x="30" y="240" width="340" height="82" rx="14" fill="#e7effc" stroke="#93abd0" stroke-width="2"/><text x="200" y="276" font-size="21" font-weight="700">Enable explicitly</text><text x="200" y="304" font-size="18">Activation is a separate step.</text><rect x="30" y="350" width="340" height="82" rx="14" fill="#fff5dc" stroke="#e2c16f" stroke-width="2"/><text x="200" y="386" font-size="21" font-weight="700">Matching event</text><text x="200" y="414" font-size="18">Opens a deduplicated incident.</text><rect x="30" y="460" width="340" height="82" rx="14" fill="#e7f7ef" stroke="#7db99b" stroke-width="2"/><text x="200" y="496" font-size="21" font-weight="700">Outbox delivery</text><text x="200" y="524" font-size="18">Worker sends and may retry.</text><rect x="30" y="580" width="340" height="78" rx="12" fill="#e9eef6"/><text x="200" y="613" font-size="18">SQL evaluator and outbox</text><text x="200" y="640" font-size="18">worker must be running.</text></g>
  <g stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"><path d="M200 104v22"/><path d="M200 214v22"/><path d="M200 324v22"/><path d="M200 434v22"/><path d="M200 544v30"/></g>
</svg>
