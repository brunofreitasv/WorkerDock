<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-labelledby="title desc">
  <title id="title">Alert rule to webhook delivery</title><desc id="desc">An enabled sink and disabled rule are reviewed, the rule is enabled, matching events open an incident, and the outbox worker attempts delivery.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#52627a"/></marker></defs><rect width="820" height="250" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17243a"><rect x="20" y="56" width="140" height="72" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="90" y="86" font-size="16" font-weight="700">Enabled sink</text><text x="90" y="108" font-size="13">approved URL</text><rect x="184" y="56" width="140" height="72" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="254" y="86" font-size="16" font-weight="700">Rule draft</text><text x="254" y="108" font-size="13">disabled to review</text><rect x="348" y="56" width="140" height="72" rx="14" fill="#e7effc" stroke="#93abd0" stroke-width="2"/><text x="418" y="86" font-size="16" font-weight="700">Enable rule</text><text x="418" y="108" font-size="13">explicit action</text><rect x="512" y="56" width="140" height="72" rx="14" fill="#fff5dc" stroke="#e2c16f" stroke-width="2"/><text x="582" y="86" font-size="16" font-weight="700">Incident</text><text x="582" y="108" font-size="13">matching event</text><rect x="676" y="56" width="124" height="72" rx="14" fill="#e7f7ef" stroke="#7db99b" stroke-width="2"/><text x="738" y="86" font-size="16" font-weight="700">Outbox</text><text x="738" y="108" font-size="13">delivery + retry</text><path d="M160 92h18M324 92h18M488 92h18M652 92h18" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/><rect x="112" y="166" width="596" height="48" rx="12" fill="#e9eef6"/><text x="410" y="187" font-size="14" font-weight="700">Monitor incidents and delivery outcomes in Alerts</text><text x="410" y="204" font-size="12">SQL evaluator and outbox worker must be running in production.</text></g>
</svg>
