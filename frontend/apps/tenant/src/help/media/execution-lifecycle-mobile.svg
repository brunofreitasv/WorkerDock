<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 690" role="img" aria-labelledby="title desc">
  <title id="title">Execution lifecycle</title><desc id="desc">An execution moves from accepted to queued, running, and a terminal result. Attempts and timeline describe recorded evidence.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#52627a"/></marker></defs><rect width="400" height="690" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17243a"><rect x="30" y="20" width="340" height="82" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="200" y="55" font-size="22" font-weight="700">Accepted</text><text x="200" y="82" font-size="18">Request recorded</text><rect x="30" y="130" width="340" height="82" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="200" y="165" font-size="22" font-weight="700">Queued</text><text x="200" y="192" font-size="18">Waiting for a worker</text><rect x="30" y="240" width="340" height="82" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="200" y="275" font-size="22" font-weight="700">Running</text><text x="200" y="302" font-size="18">An attempt is in progress</text><rect x="30" y="350" width="160" height="82" rx="14" fill="#e7f7ef" stroke="#7db99b" stroke-width="2"/><text x="110" y="398" font-size="20" font-weight="700">Succeeded</text><rect x="210" y="350" width="160" height="82" rx="14" fill="#fff1ef" stroke="#e4a49a" stroke-width="2"/><text x="290" y="385" font-size="20" font-weight="700">Failed /</text><text x="290" y="411" font-size="20" font-weight="700">Unknown</text><rect x="30" y="490" width="340" height="150" rx="14" fill="#e9eef6"/><text x="200" y="532" font-size="21" font-weight="700">Evidence in the details</text><text x="200" y="570" font-size="18">Attempts show work tried.</text><text x="200" y="600" font-size="18">Timeline shows recorded changes.</text></g>
  <g stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"><path d="M200 104v22"/><path d="M200 214v22"/><path d="M200 324v20"/></g>
</svg>
