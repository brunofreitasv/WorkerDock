<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-labelledby="title desc">
  <title id="title">Execution lifecycle</title><desc id="desc">An execution moves from accepted to queued, running, and then a terminal result. Attempts and timeline describe recorded evidence.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#52627a"/></marker></defs><rect width="820" height="250" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17243a"><rect x="24" y="54" width="150" height="68" rx="13" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="99" y="83" font-size="17" font-weight="700">Accepted</text><text x="99" y="105" font-size="13">request recorded</text><rect x="222" y="54" width="150" height="68" rx="13" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="297" y="83" font-size="17" font-weight="700">Queued</text><text x="297" y="105" font-size="13">waiting for worker</text><rect x="420" y="54" width="150" height="68" rx="13" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="495" y="83" font-size="17" font-weight="700">Running</text><text x="495" y="105" font-size="13">attempt in progress</text><rect x="650" y="37" width="144" height="54" rx="13" fill="#e7f7ef" stroke="#7db99b" stroke-width="2"/><text x="722" y="70" font-size="16" font-weight="700">Succeeded</text><rect x="650" y="112" width="144" height="54" rx="13" fill="#fff1ef" stroke="#e4a49a" stroke-width="2"/><text x="722" y="145" font-size="16" font-weight="700">Failed / Unknown</text><path d="M174 88h42M372 88h42M570 68l74-17M570 101l74 33" fill="none" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/><rect x="116" y="183" width="588" height="42" rx="12" fill="#e9eef6"/><text x="410" y="210" font-size="15">Attempts show work tried · Timeline shows recorded state changes</text></g>
</svg>
