<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" role="img" aria-labelledby="title desc">
  <title id="title">Create a first job safely</title><desc id="desc">Choose a template, save and validate a disabled draft, review it, enable it, then run it.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#52627a"/></marker></defs><rect width="400" height="660" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17243a"><g><rect x="30" y="20" width="340" height="94" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><circle cx="62" cy="67" r="20" fill="#dceeff"/><text x="62" y="74" font-size="20" font-weight="700">1</text><text x="220" y="62" font-size="22" font-weight="700">Choose a template</text><text x="220" y="88" font-size="18">Select an installed template.</text></g><g><rect x="30" y="146" width="340" height="94" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><circle cx="62" cy="193" r="20" fill="#dceeff"/><text x="62" y="200" font-size="20" font-weight="700">2</text><text x="220" y="188" font-size="22" font-weight="700">Save a disabled draft</text><text x="220" y="214" font-size="18">Add a name and configuration.</text></g><g><rect x="30" y="272" width="340" height="94" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><circle cx="62" cy="319" r="20" fill="#dceeff"/><text x="62" y="326" font-size="20" font-weight="700">3</text><text x="220" y="314" font-size="22" font-weight="700">Validate and review</text><text x="220" y="340" font-size="18">Fix issues; inspect the revision.</text></g><g><rect x="30" y="398" width="340" height="94" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><circle cx="62" cy="445" r="20" fill="#dceeff"/><text x="62" y="452" font-size="20" font-weight="700">4</text><text x="220" y="440" font-size="22" font-weight="700">Enable when ready</text><text x="220" y="466" font-size="18">Check possible external effects.</text></g><g><rect x="30" y="524" width="340" height="94" rx="14" fill="#e7f7ef" stroke="#7db99b" stroke-width="2"/><circle cx="62" cy="571" r="20" fill="#c7ebd7"/><text x="62" y="578" font-size="20" font-weight="700">5</text><text x="220" y="566" font-size="22" font-weight="700">Run and monitor</text><text x="220" y="592" font-size="18">Open the execution details.</text></g></g>
  <g stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"><path d="M200 116v25"/><path d="M200 242v25"/><path d="M200 368v25"/><path d="M200 494v25"/></g>
</svg>
