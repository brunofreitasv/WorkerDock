<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">Create a first job safely</title><desc id="desc">Choose a template, save and validate a disabled draft, review it, enable it, then run it.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#52627a"/></marker></defs><rect width="820" height="220" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17243a"><g><rect x="20" y="64" width="140" height="92" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><circle cx="43" cy="86" r="14" fill="#dceeff"/><text x="43" y="92" font-size="16" font-weight="700">1</text><text x="91" y="105" font-size="16" font-weight="700">Choose</text><text x="91" y="130" font-size="14">template</text></g><g><rect x="182" y="64" width="140" height="92" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><circle cx="205" cy="86" r="14" fill="#dceeff"/><text x="205" y="92" font-size="16" font-weight="700">2</text><text x="253" y="105" font-size="16" font-weight="700">Save</text><text x="253" y="130" font-size="14">disabled draft</text></g><g><rect x="344" y="64" width="140" height="92" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><circle cx="367" cy="86" r="14" fill="#dceeff"/><text x="367" y="92" font-size="16" font-weight="700">3</text><text x="415" y="105" font-size="16" font-weight="700">Validate</text><text x="415" y="130" font-size="14">and review</text></g><g><rect x="506" y="64" width="140" height="92" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><circle cx="529" cy="86" r="14" fill="#dceeff"/><text x="529" y="92" font-size="16" font-weight="700">4</text><text x="577" y="105" font-size="16" font-weight="700">Enable</text><text x="577" y="130" font-size="14">when ready</text></g><g><rect x="668" y="64" width="132" height="92" rx="14" fill="#e7f7ef" stroke="#7db99b" stroke-width="2"/><circle cx="691" cy="86" r="14" fill="#c7ebd7"/><text x="691" y="92" font-size="16" font-weight="700">5</text><text x="738" y="105" font-size="16" font-weight="700">Run</text><text x="738" y="130" font-size="14">and monitor</text></g></g>
  <g stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"><path d="M162 110h14"/><path d="M324 110h14"/><path d="M486 110h14"/><path d="M648 110h14"/></g>
</svg>
