<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" aria-labelledby="title desc">
  <title id="title">Choose an input source</title><desc id="desc">Select an SQL or HTTP template, declare an input, choose one supported source, validate, preview, and save.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#52627a"/></marker></defs><rect width="400" height="700" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17243a"><rect x="30" y="20" width="340" height="78" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="200" y="54" font-size="21" font-weight="700">Template 1.1.0</text><text x="200" y="80" font-size="18">SQL or HTTP</text><rect x="30" y="125" width="340" height="78" rx="14" fill="#e7effc" stroke="#93abd0" stroke-width="2"/><text x="200" y="159" font-size="21" font-weight="700">Declare the input</text><text x="200" y="185" font-size="18">Choose a field from its schema.</text><rect x="30" y="230" width="340" height="250" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="200" y="267" font-size="21" font-weight="700">Choose one source</text><text x="200" y="310" font-size="19">Fixed value</text><text x="200" y="353" font-size="19">Dynamic value</text><text x="200" y="396" font-size="19">Secret reference</text><text x="200" y="439" font-size="19">SQL NULL</text><rect x="30" y="510" width="340" height="78" rx="14" fill="#e7f7ef" stroke="#7db99b" stroke-width="2"/><text x="200" y="544" font-size="21" font-weight="700">Validate and preview</text><text x="200" y="570" font-size="18">Then save a disabled draft.</text><rect x="30" y="620" width="340" height="58" rx="12" fill="#fff5dc"/><text x="200" y="645" font-size="17">SQL inputs stay separate</text><text x="200" y="668" font-size="17">from query source text.</text></g>
  <g stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"><path d="M200 100v20"/><path d="M200 205v20"/><path d="M200 482v22"/><path d="M200 590v24"/></g>
</svg>
