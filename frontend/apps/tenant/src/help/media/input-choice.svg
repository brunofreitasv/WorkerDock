<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="title desc">
  <title id="title">Choose an input source</title><desc id="desc">Select the SQL or HTTP template, declare an input, choose a supported fixed, dynamic, secret, or null source, validate, preview, and save.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#52627a"/></marker></defs><rect width="820" height="260" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17243a"><rect x="26" y="76" width="160" height="74" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="106" y="105" font-size="16" font-weight="700">Template 1.1.0</text><text x="106" y="129" font-size="14">SQL or HTTP</text><path d="M186 113h32" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 48l82 65-82 65-82-65z" fill="#e7effc" stroke="#93abd0" stroke-width="2"/><text x="300" y="109" font-size="16" font-weight="700">Declare</text><text x="300" y="132" font-size="14">input field</text><path d="M382 113h30" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/><rect x="414" y="30" width="170" height="166" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="499" y="57" font-size="15" font-weight="700">Choose one source</text><text x="499" y="88" font-size="14">Fixed value</text><text x="499" y="116" font-size="14">Dynamic value</text><text x="499" y="144" font-size="14">Secret reference</text><text x="499" y="172" font-size="14">SQL NULL</text><path d="M584 113h30" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/><rect x="616" y="76" width="176" height="74" rx="14" fill="#e7f7ef" stroke="#7db99b" stroke-width="2"/><text x="704" y="105" font-size="16" font-weight="700">Validate + preview</text><text x="704" y="129" font-size="14">then save draft</text><rect x="168" y="214" width="484" height="28" rx="10" fill="#fff5dc"/><text x="410" y="234" font-size="13">Inputs stay separate from SQL source text and secret values.</text></g>
</svg>
