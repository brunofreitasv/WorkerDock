<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-labelledby="title desc">
  <title id="title">Configure and verify a schedule</title><desc id="desc">Choose recurring cron or one-time scheduling, select a time zone, preview UTC occurrences, set missed-run policy, save disabled, and enable.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#52627a"/></marker></defs><rect width="820" height="230" rx="18" fill="#f5f8fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17243a"><rect x="26" y="56" width="146" height="82" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="99" y="86" font-size="16" font-weight="700">Schedule type</text><text x="99" y="112" font-size="14">Cron / one-time</text><rect x="194" y="56" width="146" height="82" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="267" y="86" font-size="16" font-weight="700">Time zone</text><text x="267" y="112" font-size="14">local intent</text><rect x="362" y="56" width="146" height="82" rx="14" fill="#e7effc" stroke="#93abd0" stroke-width="2"/><text x="435" y="86" font-size="16" font-weight="700">Preview</text><text x="435" y="112" font-size="14">UTC + offset</text><rect x="530" y="56" width="124" height="82" rx="14" fill="#fff" stroke="#adc0d8" stroke-width="2"/><text x="592" y="86" font-size="16" font-weight="700">Policy</text><text x="592" y="112" font-size="14">missed runs</text><rect x="676" y="56" width="118" height="82" rx="14" fill="#e7f7ef" stroke="#7db99b" stroke-width="2"/><text x="735" y="86" font-size="15" font-weight="700">Save, review</text><text x="735" y="112" font-size="14">then enable</text><path d="M172 97h18M340 97h18M508 97h18M654 97h18" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="170" width="480" height="34" rx="11" fill="#fff5dc"/><text x="410" y="193" font-size="14">Preview predicts occurrences; it does not run the job.</text></g>
</svg>
